[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "lionstone"
version = "0.3.2"
description = "Open-source AI editing agent that turns raw podcasts, interviews and talks into publish-ready video — with an edit plan you can read, undo and verify."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "İsmail Arslantaş" }]
keywords = [
  "video-editing", "ai-agent", "podcast", "ffmpeg", "whisper", "subtitles",
  "auto-editor", "silence-removal", "remotion", "mcp", "post-production",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video :: Non-Linear Editor",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = []  # core runs on the standard library + FFmpeg

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0", "av<19"]  # faster-whisper 1.2 passes metadata_errors, removed in PyAV 19
mcp = ["mcp>=1.2"]
rich = ["rich>=13"]
extras = ["numpy>=1.24"]  # multicam, style learning, clips, creative presets
vision = ["numpy>=1.24", "opencv-python-headless>=4.8"]  # face-following reframe + vision QA
all = ["faster-whisper>=1.0", "av<19", "mcp>=1.2", "rich>=13", "numpy>=1.24", "opencv-python-headless>=4.8"]
dev = ["pytest>=8", "ruff>=0.5", "numpy>=1.24"]

[project.scripts]
lionstone = "lionstone.cli:main"

[project.urls]
Homepage = "https://github.com/ismailarslantas/lionstone"
Documentation = "https://github.com/ismailarslantas/lionstone/tree/main/docs"
Issues = "https://github.com/ismailarslantas/lionstone/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/lionstone"]

[tool.hatch.build.targets.wheel.force-include]
"effects/catalog" = "lionstone/_catalog"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "E731", "B905", "E741"]
