name: 🎞️ Effect request
description: Suggest a title, lower third or transition
labels: [effects]
body:
  - type: input
    id: name
    attributes:
      label: Effect name
  - type: textarea
    id: look
    attributes:
      label: What it looks like and when to use it
      description: A reference link or sketch helps. Timing (enter / hold / exit)?
    validations:
      required: true
