name: bootstrap
# One-time importer: unpacks bootstrap.tar.gz into the repository, then this file is replaced by ci.yml.
on:
  push:
    paths: ["bootstrap.tar.gz"]
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack archive
        run: |
          tar -xzf bootstrap.tar.gz
          git rm -q bootstrap.tar.gz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':!.github/workflows'
          git commit -m "Import Lionstone v0.1.0"
          git push
