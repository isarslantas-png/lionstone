<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Lionstone — open-source AI editing agent">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121216"/>
      <stop offset="1" stop-color="#1d1a17"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5CF7A"/>
      <stop offset="1" stop-color="#C98A2B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E8B04B" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#E8B04B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="400" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="28" fill="url(#glow)"/>

  <!-- mark: a faceted stone with a mane of rays -->
  <g transform="translate(250 200)">
    <g stroke="#E0A746" stroke-width="6" stroke-linecap="round" opacity="0.9">
      <line x1="0" y1="-92" x2="0" y2="-128"/>
      <line x1="65" y1="-65" x2="91" y2="-91"/>
      <line x1="92" y1="0" x2="128" y2="0"/>
      <line x1="65" y1="65" x2="91" y2="91"/>
      <line x1="0" y1="92" x2="0" y2="128"/>
      <line x1="-65" y1="65" x2="-91" y2="91"/>
      <line x1="-92" y1="0" x2="-128" y2="0"/>
      <line x1="-65" y1="-65" x2="-91" y2="-91"/>
    </g>
    <polygon points="0,-78 68,-39 68,39 0,78 -68,39 -68,-39" fill="#1b1b20" stroke="url(#gold)" stroke-width="5"/>
    <polygon points="0,-78 68,-39 0,0" fill="#E8B04B" opacity="0.22"/>
    <polygon points="-68,39 0,78 0,0" fill="#E8B04B" opacity="0.12"/>
    <!-- play / cut glyph -->
    <polygon points="-18,-28 30,0 -18,28" fill="url(#gold)"/>
  </g>

  <text x="430" y="178" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="82" font-weight="800" fill="#FFFFFF" letter-spacing="-1.5">Lionstone</text>
  <text x="434" y="226" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#CFC8BD">The open-source AI editing agent for podcasts, interviews &amp; talks.</text>
  <text x="434" y="262" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#9C958B">Cuts · syncs · mixes · titles · captions — and <tspan fill="#E8B04B" font-weight="700">verifies</tspan> before it delivers.</text>

  <!-- timeline strip: kept (gold) vs removed (hatched) -->
  <g transform="translate(434 300)">
    <rect x="0" y="0" width="780" height="34" rx="8" fill="#26262c"/>
    <rect x="6" y="6" width="150" height="22" rx="4" fill="#E8B04B"/>
    <rect x="162" y="6" width="34" height="22" rx="4" fill="#3a3a42"/>
    <rect x="202" y="6" width="210" height="22" rx="4" fill="#E8B04B"/>
    <rect x="418" y="6" width="18" height="22" rx="4" fill="#3a3a42"/>
    <rect x="442" y="6" width="120" height="22" rx="4" fill="#E8B04B"/>
    <rect x="568" y="6" width="52" height="22" rx="4" fill="#3a3a42"/>
    <rect x="626" y="6" width="148" height="22" rx="4" fill="#E8B04B"/>
    <text x="0" y="58" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="16" fill="#8d877e">90:00 raw  →  plan.json  →  render  →  QA ✓  →  57:12 publish-ready</text>
  </g>
</svg>
